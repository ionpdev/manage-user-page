<form class="form" (submit)="onSubmit(); $event.preventDefault()">
  <div class="form__field">
    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      class="control"
      placeholder="e.g. alice"
      [formField]="userForm.username"
    />
    @if (userForm.username().touched() && userForm.username().invalid()) {
      <small class="form__error">Username must be at least 2 characters.</small>
    }
  </div>

  <div class="form__field">
    <label for="role">Role</label>
    <select id="role" class="control" [formField]="userForm.role">
      @for (r of roles; track r) {
        <option [value]="r">{{ r }}</option>
      }
    </select>
  </div>

  <div class="form__actions">
    <button uiButton type="submit" [disabled]="userForm().invalid()">
      {{ editing() ? 'Save' : 'Add user' }}
    </button>
    @if (editing()) {
      <button uiButton variant="secondary" type="button" (click)="cancelled.emit()">Cancel</button>
    }
  </div>
</form>
