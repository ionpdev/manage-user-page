<td class="cell cell--name" data-label="Username">{{ user().username }}</td>
<td data-label="Role">{{ user().role }}</td>
<td data-label="Status"><ui-badge [tone]="user().status">{{ user().status }}</ui-badge></td>
<td
  class="cell--muted"
  data-label="Created"
  [title]="user().createdAt?.toDate() | date: 'medium'"
>
  {{ user().createdAt | timeAgo }}
</td>
<td class="cell--actions" data-label="Actions">
  <button
    uiButton
    variant="ghost"
    size="sm"
    type="button"
    [attr.aria-label]="'Edit ' + user().username"
    (click)="edit.emit(user())"
  >
    Edit
  </button>
  <button
    uiButton
    variant="ghost"
    size="sm"
    type="button"
    [attr.aria-label]="toggleLabel() + ' ' + user().username"
    (click)="toggle.emit(user())"
  >
    {{ toggleLabel() }}
  </button>
  <button
    uiButton
    variant="danger"
    size="sm"
    type="button"
    [attr.aria-label]="'Remove ' + user().username"
    (click)="remove.emit(user())"
  >
    Remove
  </button>
</td>
