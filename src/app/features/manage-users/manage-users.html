<main class="page">
  <header class="page__header">
    <h1>Manage Users</h1>
    <span class="count">{{ userService.users().length }} user(s)</span>
  </header>

  <section class="card">
    <h2 class="card__title">Add user</h2>
    <app-user-form (submitted)="onAdd($event)" />
  </section>

  <section class="card">
    <app-user-search (termChange)="searchTerm.set($event)" />

    @if (userService.loading()) {
      <p class="loading">Loading…</p>
    } @else if (userService.users().length === 0) {
      <ui-empty-state>No users yet — add your first one.</ui-empty-state>
    } @else if (visibleUsers().length === 0) {
      <ui-empty-state>No users match “{{ searchTerm() }}”.</ui-empty-state>
    } @else {
      <app-user-list [users]="visibleUsers()" />
    }
  </section>
</main>
